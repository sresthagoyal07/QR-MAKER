<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SRAVA QR</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <section class="navSection">
        <!-- Name of the project in the Navigation -->
        <nav class="navBar">
            <h1 class="projectName">SRAVA QR</h1>
        </nav>
    </section>
    <section class="inputSection">
        <!-- Input and Button for QR Code Generation -->
        <input class="inputurl" type="text" placeholder="Enter Your URL to generate QR code">
        <button class="generateBtn">Generate QR Code</button>
    </section>
    <section class="qrSection">
        <div class="qrContainer">
            <!-- QR code will be displayed here -->
        </div>
    </section>
    <section class="downloadSection">
        <button class="downloadBtn">Download QR Code</button>
    </section>
    <section class="footerSection">
        <h1 class="footer1">
            Made with ❤️
        </h1>
        <h2 class="footer2">
            SRAVA made by Srestha Goyal 
        </h2>
    </section>
</body>
<script src="script.js"></script>
</html>
